# ============================================================================
# ORBIT-2 GLOBAL precipitation inference config.
#   checkpoint : global-finetune/global_126m_precipitation.ckpt (126.71M params)
#   task       : global precipitation downscaling, 0.25 deg -> 0.0625 deg
#   grid       : low-res 720 x 1440 -> high-res 2880 x 5760 (superres_mag = 4)
#
# Fixed three things that made this file unusable out of the box:
#  * low_res_dir/high_res_dir pointed at
#    kurihana/super-res-torchlight/superres/era5/0.25_deg_test, which is an
#    empty directory tree on /lustre (no npz, no lat.npy) - repointed at the
#    ERA5-IMERG-FUSED / IMERG pair named by the checkpoint's own yaml.
#  * overlap was 2, but the checkpoint's pos_embed is (1, 16928, 1024).  With
#    div=4 the tile is (720/4 + top+bottom) x (1440/4 + left+right); only
#    overlap=4 gives 184 x 368 -> (184/2)*(368/2) = 16928 tokens.  overlap=2
#    gives 16562 and silently bicubic-interpolates the positional embedding.
#  * dict_in_variables['INFER'] listed 19 channels; the global checkpoint was
#    fine-tuned on all 23 default_vars (its yaml's 'ERA5-IMERG-FUSED' entry).
#
# This is heavy: 126M params, 16 tiles, full 2880x5760 output. Run it on a
# compute node rather than a login node:
#   CONFIG=../configs/inference.yaml sbatch -A csc662 -q debug -t 00:20:00 \
#       -N 1 examples/launch_visualize.sh
# ============================================================================

#-----------   TRAINER -------------
trainer:
  max_epochs: 100
  checkpoint: 
  pretrain: "/lustre/orion/csc662/proj-shared/xinru/models/orbit2/global-finetune/global_126m_precipitation.ckpt"
  batch_size: 1 
  buffer_size: 10
  num_workers: 2
  data_type: float32
  train_loss: "bayesian_tv"


#----------  Parallelism -------------
parallelism:
  fsdp: 8   # unused by visualize.py: fsdp_size = world_size // tensor_par
  simple_ddp: 1
  tensor_par: 1
  seq_par: 1
 
### Tiling
tiling:
  do_tiling: True
  div: 4
  overlap: 4   # 4 (not 2): only this makes the tile match pos_embed exactly
 
# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 5e-4
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 1024
  depth: 8
  decoder_depth: 4
  num_heads: 16
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

