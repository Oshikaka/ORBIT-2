# ============================================================================
# ORBIT-2 inference / visualization config
#   checkpoint : us-finetune/us_9.5m_temperature.ckpt  (7.16M params)
#   task       : US regional daily-minimum-temperature downscaling,
#                15 arcmin -> 3.75 arcmin
#   grid       : low-res 120 x 240  ->  high-res 480 x 960   (superres_mag = 4)
#
# Hyper-parameters copied verbatim from us_9.5m_temperature.yaml (shipped next
# to the .ckpt).  Its 'DAYMET_1' entry uses a 7-channel input and predicts a
# single output channel, 2m_temperature_min -- which is what the checkpoint
# tensors say too (path2.0.weight (64, 5, 3, 3) => out_channels = 5 - 4 = 1,
# head.8.weight (64, 256) => 1 * (superres_mag*patch_size)^2).
#
# The 7 input channels are exactly the Daymet variable set, and the original
# low-res staging directory is gone, so the low-res input here is Daymet
# coarsened to 15 arcmin -- i.e. plain 4x super-resolution of Daymet tmin.
# Verified: the one surviving file of the original staging directory holds
# Daymet (not ERA5) 2m_temperature_min/max at 3.75 arcmin, max|diff| == 0 vs
# daymet/3.75_arcmin.  Sample 0 of the 2021 test split with this checkpoint
# gives PSNR 25.71 / SSIM 0.922 / RMSE 4.34 K (RMSE is inflated by the ocean,
# where Daymet stores a ~213 K fill value that the model reproduces).
#
# Run with (single GPU):
#   ./examples/run_visualize_1gpu.sh ../configs/infer_us_9.5m_temp.yaml \
#       --variable 2m_temperature_min --output-dir ../outputs/us_9.5m_temp
# ============================================================================

#-----------   TRAINER -------------
trainer:
  max_epochs: 1
  checkpoint:
  pretrain: "/lustre/orion/csc662/proj-shared/xinru/models/orbit2/us-finetune/us_9.5m_temperature.ckpt"
  batch_size: 1
  buffer_size: 10
  num_workers: 1
  data_type: float32
  train_loss: "mse"

#----------  Parallelism -------------
parallelism:
  fsdp: 1
  simple_ddp: 1
  tensor_par: 1
  seq_par: 1

### Tiling
tiling:
  do_tiling: False
  div: 1
  overlap: 0

# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 1e-5
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
data:
  low_res_dir: {
    'DAYMET': "/lustre/orion/lrn036/world-shared/data/superres/daymet/15.0_arcmin",
  }
  high_res_dir: {
    'DAYMET': "/lustre/orion/lrn036/world-shared/data/superres/daymet/3.75_arcmin",
  }

  spatial_resolution: {
    'DAYMET': 28,
  }

  default_vars: [
    "land_sea_mask",
    "orography",
    "lattitude",
    "landcover",
    "2m_temperature",
    "2m_temperature_max",
    "2m_temperature_min",
    "temperature_200",
    "temperature_500",
    "temperature_850",
    "10m_u_component_of_wind",
    "u_component_of_wind_200",
    "u_component_of_wind_500",
    "u_component_of_wind_850",
    "10m_v_component_of_wind",
    "v_component_of_wind_200",
    "v_component_of_wind_500",
    "v_component_of_wind_850",
    "specific_humidity_200",
    "specific_humidity_500",
    "specific_humidity_850",
    "total_precipitation_24hr",
    "volumetric_soil_water_layer_1",
  ]

  dict_in_variables: {
    'DAYMET': [
      "land_sea_mask",
      "orography",
      "lattitude",
      "landcover",
      "total_precipitation_24hr",
      "2m_temperature_min",
      "2m_temperature_max",
    ],
  }

  dict_out_variables: {
    'DAYMET': [
      "2m_temperature_min",
    ],
  }

  var_weights: {
    "2m_temperature": 10,
    "10m_u_component_of_wind": 1,
    "10m_v_component_of_wind": 1,
    "total_precipitation_24hr": 1,
    "2m_temperature_min": 10,
    "2m_temperature_max": 10,
  }
